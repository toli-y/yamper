<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Lode Runner</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #334155;
        --panel: rgba(8, 10, 16, 0.84);
        --gold: #f4d35e;
        --cyan: #7ee0ff;
        --brick: #e25a32;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fcfcfc;
        touch-action: none;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.45rem 1.2rem;
        padding: 0.45rem 0.8rem 0.55rem;
        background: #000;
        border-top: 2px solid #fcfcfc;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: clamp(0.7rem, 2.1vw, 0.95rem);
        letter-spacing: 0.12em;
        pointer-events: none;
      }
      .hud .stat {
        font-variant-numeric: tabular-nums;
      }
      .hud b {
        color: #f8d020;
        font-weight: 700;
      }
      .hint {
        margin: 0;
        color: #a0a0a0;
        letter-spacing: 0.06em;
        font-size: 0.72rem;
      }
      .hint kbd {
        display: inline-block;
        padding: 0 0.22rem;
        border: 1px solid #666;
        color: #fcfcfc;
        font: inherit;
        font-size: 0.68rem;
      }
      a {
        color: var(--cyan);
        pointer-events: auto;
      }
      .banner {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        width: min(26rem, calc(100vw - 2rem));
        padding: 1.15rem 1.2rem 1.2rem;
        border-radius: 16px;
        border: 1px solid #334155;
        background: rgba(8, 10, 16, 0.94);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .banner.show {
        display: block;
      }
      .banner h2 {
        margin: 0 0 0.4rem;
        font-size: 1.2rem;
        letter-spacing: 0.06em;
        color: var(--gold);
      }
      .banner p {
        margin: 0 0 0.9rem;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
      }
      .banner button,
      .touch button {
        appearance: none;
        border: 1px solid #334155;
        background: #111827;
        color: var(--ink);
        border-radius: 8px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .banner button:hover,
      .touch button:hover {
        border-color: var(--cyan);
      }
      .touch {
        position: fixed;
        inset: auto 0 3.1rem 0;
        z-index: 4;
        display: none;
        justify-content: space-between;
        padding: 0 0.7rem;
        pointer-events: none;
      }
      .touch .pad,
      .touch .digs {
        display: grid;
        gap: 0.35rem;
        pointer-events: auto;
      }
      .touch .pad {
        grid-template-columns: 3.1rem 3.1rem 3.1rem;
        grid-template-rows: 3.1rem 3.1rem 3.1rem;
      }
      .touch .pad button:nth-child(1) {
        grid-column: 2;
      }
      .touch .pad button:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
      }
      .touch .pad button:nth-child(3) {
        grid-column: 3;
        grid-row: 2;
      }
      .touch .pad button:nth-child(4) {
        grid-column: 2;
        grid-row: 3;
      }
      .touch .digs {
        align-content: end;
        grid-template-columns: 5.2rem;
      }
      .touch button {
        width: 100%;
        height: 3.1rem;
        background: rgba(17, 24, 39, 0.78);
        font-weight: 700;
        user-select: none;
      }
      .touch .digs button {
        height: 4.2rem;
      }
      @media (pointer: coarse) {
        .touch {
          display: flex;
        }
        .hud .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <aside class="hud">
      <span class="stat">SCORE-<b id="score">000000</b></span>
      <span class="stat">MEN-<b id="lives">05</b></span>
      <span class="stat">STAGE-<b id="stage">01</b></span>
      <span class="stat">GOLD-<b id="gold">0/0</b></span>
      <p class="hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
        · <kbd>Space</kbd> dig
        · <kbd>R</kbd> retry
        · <a href="/">All projects</a>
      </p>
    </aside>
    <div class="banner show" id="banner">
      <h2>LODE RUNNER</h2>
      <p id="banner-copy">
        Stage 1. Collect every gold pile, trap the magenta guards, then climb
        the hidden ladder. WASD to move. Space digs a pit in the way you face.
      </p>
      <button type="button" id="banner-btn">PRESS SPACE</button>
    </div>
    <div class="touch" aria-hidden="true">
      <div class="pad">
        <button type="button" data-dir="up">W</button>
        <button type="button" data-dir="left">A</button>
        <button type="button" data-dir="right">D</button>
        <button type="button" data-dir="down">S</button>
      </div>
      <div class="digs">
        <button type="button" data-dig="face">DIG</button>
      </div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { makePlayer } from "./_models/player.js";
      import { makeGuard } from "./_models/guard.js";
      import { makeBrick, makeSolid, makeTrap, makePit } from "./_models/tiles.js";
      import { makeLadder } from "./_models/ladder.js";
      import { makeRope } from "./_models/rope.js";
      import { makeGold } from "./_models/gold.js";

      /**
       * Stage maps are equal-length strings, one row each.
       * Nintendo Lode Runner uses the classic 28×16 boards, cropped in camera
       * rather than in data so later stages can stay on the same grid.
       *
       *  " " empty    "#" brick (diggable)    "@" solid
       *  "H" ladder   "-" rope                "X" trap brick
       *  "S" hidden escape ladder             "$" gold
       *  "0" guard    "&" runner
       */
      const STAGES = [
        {
          id: 1,
          name: "Treasury 1",
          map: [
            "                  S         ",
            "    $             S         ",
            "#######H#######   S         ",
            "       H----------S    $    ",
            "       H    ##H   #######H##",
            "       H    ##H          H  ",
            "     0 H    ##H       $0 H  ",
            "##H#####    ########H#######",
            "  H                 H       ",
            "  H           0     H       ",
            "#########H##########H       ",
            "         H          H       ",
            "       $ H----------H   $   ",
            "    H######         #######H",
            "    H         &  $         H",
            "############################",
          ],
        },
      ];

      const SPEED_PLAYER = 5.35;
      const SPEED_GUARD = 3.7;
      const SPEED_FALL = 9.4;
      const DIG_TIME = 0.26;
      const HOLE_LIFE = 6.75;
      const HOLE_STUCK = 3.15;
      const ALIGN = 0.22;
      const START_LIVES = 5;

      const keys = new Set();
      const hold = { up: false, down: false, left: false, right: false };
      let digQueue = 0;
      let audioCtx = null;

      const banner = document.getElementById("banner");
      const bannerCopy = document.getElementById("banner-copy");
      const bannerBtn = document.getElementById("banner-btn");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 80);
      const clock = new THREE.Clock();

      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      const sun = new THREE.DirectionalLight(0xffffff, 1.05);
      sun.position.set(4, 10, 14);
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xa8c8ff, 0.28);
      fill.position.set(-8, 3, 8);
      scene.add(fill);

      let state = "title";
      let stageIndex = 0;
      let cols = 28;
      let rows = 16;
      let grid = [];
      let baseGrid = [];
      let holes = [];
      let golds = [];
      let guards = [];
      let runner = null;
      let tileGroup = null;
      let actorGroup = null;
      let fxGroup = null;
      let tileMeshes = [];
      let score = 0;
      let lives = START_LIVES;
      let goldLeft = 0;
      let goldTotal = 0;
      let exitOpen = false;
      let camX = 0;
      let camY = 0;
      let shake = 0;
      let bannerMode = "start";
      const particles = [];

      const worldRoot = new THREE.Group();
      scene.add(worldRoot);

      function worldPos(x, y, z = 0) {
        return new THREE.Vector3(x + 0.5, rows - y - 0.5, z);
      }

      function inBounds(x, y) {
        return x >= 0 && y >= 0 && x < cols && y < rows;
      }

      function tile(x, y) {
        if (!inBounds(x, y)) return y >= rows ? "@" : " ";
        return grid[y][x];
      }

      function isHole(x, y) {
        return holes.some((h) => h.x === x && h.y === y);
      }

      function isBlocking(x, y) {
        if (x < 0 || x >= cols) return true;
        if (y < 0) return false;
        if (y >= rows) return true;
        const t = grid[y][x];
        if (t === "@") return true;
        if (t === "#" && !isHole(x, y)) return true;
        return false;
      }

      function isLadder(x, y) {
        const t = tile(x, y);
        return t === "H" || (t === "S" && exitOpen);
      }

      function isRope(x, y) {
        return tile(x, y) === "-";
      }

      function trappedGuardAt(x, y) {
        return guards.find((g) => g.alive && g.stuck && Math.round(g.x) === x && Math.round(g.y) === y);
      }

      function aligned(v) {
        return Math.abs(v - Math.round(v)) < ALIGN;
      }

      function roundish(v) {
        return Math.round(v);
      }

      function bodyBlocked(x, y) {
        return isBlocking(x, y);
      }

      function supported(actor) {
        const tx = roundish(actor.x);
        const ty = roundish(actor.y);
        if (actor.stuck) return true;
        if (isLadder(tx, ty)) return true;
        if (isRope(tx, ty) && aligned(actor.y)) return true;
        if (isBlocking(tx, ty + 1) || trappedGuardAt(tx, ty + 1)) return true;
        return false;
      }

      function makeActor(kind) {
        return kind === "player" ? makePlayer(THREE) : makeGuard(THREE);
      }

      function addTileVisual(x, y, ch) {
        const p = worldPos(x, y);
        const node = { brick: null, pit: null, extra: null };
        if (ch === "#" || ch === "X" || ch === "@") {
          const mesh =
            ch === "@" ? makeSolid(THREE) : ch === "X" ? makeTrap(THREE) : makeBrick(THREE);
          mesh.position.copy(p);
          tileGroup.add(mesh);
          node.brick = mesh;
          const pit = makePit(THREE);
          pit.position.copy(p);
          pit.visible = false;
          tileGroup.add(pit);
          node.pit = pit;
        }
        if (ch === "H" || ch === "S") {
          const ladder = makeLadder(THREE, ch === "S");
          ladder.position.copy(p);
          ladder.visible = ch === "H";
          tileGroup.add(ladder);
          node.extra = ladder;
        }
        if (ch === "-") {
          const rope = makeRope(THREE);
          rope.position.copy(p);
          tileGroup.add(rope);
          node.extra = rope;
        }
        tileMeshes[y][x] = node;
      }

      function clearWorld() {
        if (tileGroup) worldRoot.remove(tileGroup);
        if (actorGroup) worldRoot.remove(actorGroup);
        if (fxGroup) worldRoot.remove(fxGroup);
        tileGroup = new THREE.Group();
        actorGroup = new THREE.Group();
        fxGroup = new THREE.Group();
        worldRoot.add(tileGroup, actorGroup, fxGroup);
        for (const p of particles) fxGroup.remove(p.mesh);
        particles.length = 0;
      }

      function parseStage(stage) {
        const map = stage.map;
        rows = map.length;
        cols = map[0].length;
        for (const row of map) {
          if (row.length !== cols) {
            throw new Error(`Stage ${stage.id} rows must all be ${cols} chars`);
          }
        }
        grid = map.map((row) => row.split(""));
        baseGrid = grid.map((row) => row.slice());
      }

      function loadStage(index, keepScore) {
        stageIndex = index;
        const stage = STAGES[index];
        parseStage(stage);
        if (!keepScore) {
          score = 0;
          lives = START_LIVES;
        }
        holes = [];
        golds = [];
        guards = [];
        goldLeft = 0;
        exitOpen = false;
        shake = 0;
        clearWorld();
        tileMeshes = Array.from({ length: rows }, () => Array(cols).fill(null));

        runner = {
          x: 0,
          y: 0,
          facing: 1,
          falling: false,
          stuck: false,
          digging: 0,
          digDir: 0,
          alive: true,
          mesh: makeActor("player"),
          laser: new THREE.Mesh(
            new THREE.BoxGeometry(0.95, 0.07, 0.07),
            new THREE.MeshBasicMaterial({ color: 0x9ef6ff })
          ),
        };
        runner.laser.visible = false;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const ch = grid[y][x];
            addTileVisual(x, y, ch);
            if (ch === "$") {
              goldLeft += 1;
              const mesh = makeGold(THREE);
              mesh.position.copy(worldPos(x, y));
              tileGroup.add(mesh);
              golds.push({ x, y, mesh, taken: false, carrier: null });
              grid[y][x] = " ";
            }
            if (ch === "0") {
              const g = {
                x,
                y,
                spawnX: x,
                spawnY: y,
                facing: -1,
                falling: false,
                stuck: false,
                stuckT: 0,
                climbingOut: 0,
                carrying: null,
                dropIn: 0,
                alive: true,
                thinkT: 0,
                wish: { x: 0, y: 0 },
                mesh: makeActor("guard"),
              };
              actorGroup.add(g.mesh);
              guards.push(g);
              grid[y][x] = " ";
            }
            if (ch === "&") {
              runner.x = x;
              runner.y = y;
              grid[y][x] = " ";
            }
          }
        }
        goldTotal = goldLeft;
        actorGroup.add(runner.mesh);
        actorGroup.add(runner.laser);
        camX = runner.x;
        camY = rows - runner.y;
        syncActorMesh(runner, 0);
        for (const g of guards) syncActorMesh(g, 0);
        updateHud();
      }

      function updateHud() {
        document.getElementById("score").textContent = String(score).padStart(6, "0");
        document.getElementById("lives").textContent = String(lives).padStart(2, "0");
        document.getElementById("stage").textContent = String(STAGES[stageIndex].id).padStart(2, "0");
        const collected = golds.filter((g) => g.taken).length;
        document.getElementById("gold").textContent = `${collected}/${goldTotal}`;
      }

      function beep(freq, dur, type = "square", gain = 0.05) {
        try {
          if (!audioCtx) audioCtx = new AudioContext();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(gain, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(audioCtx.destination);
          o.start(t);
          o.stop(t + dur);
        } catch {
          /* ignore */
        }
      }

      function spawnBits(x, y, color, n = 8) {
        const p = worldPos(x, y);
        for (let i = 0; i < n; i++) {
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.1, 0.1),
            new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
          );
          mesh.position.copy(p);
          fxGroup.add(mesh);
          particles.push({
            mesh,
            vx: (Math.random() - 0.5) * 3,
            vy: Math.random() * 3 + 1,
            vz: (Math.random() - 0.5) * 2,
            life: 0.45 + Math.random() * 0.25,
          });
        }
      }

      function wishFromInput() {
        let x = 0;
        let y = 0;
        if (keys.has("a") || keys.has("arrowleft") || hold.left) x -= 1;
        if (keys.has("d") || keys.has("arrowright") || hold.right) x += 1;
        if (keys.has("w") || keys.has("arrowup") || hold.up) y -= 1;
        if (keys.has("s") || keys.has("arrowdown") || hold.down) y += 1;
        return { x, y };
      }

      function canDigAt(x, y) {
        if (!inBounds(x, y)) return false;
        if (grid[y][x] !== "#") return false;
        if (isHole(x, y)) return false;
        if (isLadder(x, y - 1) || isRope(x, y - 1)) return false;
        if (golds.some((g) => !g.taken && g.x === x && g.y === y - 1)) return false;
        if (Math.round(runner.x) === x && Math.round(runner.y) === y) return false;
        if (guards.some((g) => g.alive && Math.round(g.x) === x && Math.round(g.y) === y && !g.stuck)) {
          return false;
        }
        return true;
      }

      function startDig(dir) {
        if (state !== "play" || !runner.alive || runner.digging > 0 || runner.falling || runner.stuck) {
          return;
        }
        if (!supported(runner)) return;
        const tx = roundish(runner.x) + dir;
        const ty = roundish(runner.y) + 1;
        if (!canDigAt(tx, ty)) return;
        runner.facing = dir;
        runner.digging = DIG_TIME;
        runner.digDir = dir;
        beep(180, 0.18, "sawtooth", 0.04);
      }

      function openHole(x, y) {
        holes.push({ x, y, t: 0 });
        const node = tileMeshes[y][x];
        if (node?.brick) node.brick.visible = false;
        if (node?.pit) node.pit.visible = true;
        spawnBits(x, y, 0xc44a28, 10);
        shake = 0.12;
      }

      function fillHole(h) {
        const node = tileMeshes[h.y][h.x];
        if (node?.brick) node.brick.visible = true;
        if (node?.pit) node.pit.visible = false;
        const gold = golds.find((g) => !g.taken && g.x === h.x && g.y === h.y);
        if (gold) collectGold(gold, true);
        if (runner.alive && roundish(runner.x) === h.x && roundish(runner.y) === h.y) {
          killRunner();
        }
        for (const g of guards) {
          if (g.alive && g.stuck && roundish(g.x) === h.x && roundish(g.y) === h.y) {
            crushGuard(g);
          }
        }
      }

      function collectGold(gold, silent) {
        if (gold.taken) return;
        gold.taken = true;
        gold.carrier = null;
        gold.mesh.visible = false;
        goldLeft = golds.filter((g) => !g.taken).length;
        score += 250;
        if (!silent) {
          beep(740, 0.12, "square", 0.05);
          beep(980, 0.16, "square", 0.04);
          spawnBits(gold.x, gold.y, 0xf4d35e, 7);
        }
        if (golds.every((g) => g.taken)) openExit();
        updateHud();
      }

      function openExit() {
        if (exitOpen) return;
        if (!golds.every((g) => g.taken)) return;
        exitOpen = true;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (baseGrid[y][x] === "S" && tileMeshes[y][x]?.extra) {
              tileMeshes[y][x].extra.visible = true;
            }
          }
        }
        beep(520, 0.18, "square", 0.05);
        beep(780, 0.28, "square", 0.05);
      }

      function tryPickupGold(actor) {
        const gx = roundish(actor.x);
        const gy = roundish(actor.y);
        const gold = golds.find((g) => !g.taken && !g.carrier && g.x === gx && g.y === gy);
        if (!gold) return;
        if (actor === runner) collectGold(gold, false);
        else if (!actor.carrying && aligned(actor.x) && aligned(actor.y)) {
          gold.carrier = actor;
          gold.mesh.visible = false;
          actor.carrying = gold;
          actor.dropIn = 6 + Math.floor(Math.random() * 8);
          updateHud();
        }
      }

      function dropGold(actor) {
        const gold = actor.carrying;
        if (!gold) return;
        actor.carrying = null;
        gold.carrier = null;
        gold.taken = false;
        gold.x = roundish(actor.x);
        gold.y = roundish(actor.y);
        gold.mesh.visible = true;
        gold.mesh.position.copy(worldPos(gold.x, gold.y));
        goldLeft = golds.filter((g) => !g.taken).length;
        updateHud();
      }

      function crushGuard(g) {
        dropGold(g);
        g.alive = false;
        g.stuck = false;
        g.mesh.visible = false;
        score += 75;
        spawnBits(g.x, g.y, 0xe23d4a, 12);
        beep(110, 0.22, "triangle", 0.05);
        updateHud();
        setTimeout(() => respawnGuard(g), 700);
      }

      function respawnGuard(g) {
        if (state !== "play") return;
        dropGold(g);
        for (let i = 0; i < cols; i++) {
          const x = (g.spawnX + i) % cols;
          if (!isBlocking(x, 0) && !isBlocking(x, 1)) {
            g.x = x;
            g.y = 0;
            g.alive = true;
            g.stuck = false;
            g.falling = true;
            g.climbingOut = 0;
            g.mesh.visible = true;
            updateHud();
            return;
          }
        }
      }

      function killRunner() {
        if (!runner.alive || state !== "play") return;
        runner.alive = false;
        shake = 0.35;
        spawnBits(runner.x, runner.y, 0x7ee0ff, 14);
        beep(90, 0.4, "sawtooth", 0.06);
        lives -= 1;
        updateHud();
        setTimeout(() => {
          if (lives <= 0) {
            showBanner(
              "gameover",
              "Game over",
              "The Bungeling guards recovered the gold. Enter again from Stage 1.",
              "Retry from Stage 1"
            );
          } else {
            loadStage(stageIndex, true);
            state = "play";
          }
        }, 700);
      }

      function winStage() {
        state = "won";
        score += 1500;
        lives = Math.min(9, lives + 1);
        updateHud();
        beep(523, 0.15);
        beep(659, 0.18);
        beep(784, 0.32);
        const next = stageIndex + 1;
        if (next < STAGES.length) {
          showBanner(
            "next",
            `Stage ${String(STAGES[stageIndex].id).padStart(2, "0")} cleared`,
            "The escape ladder opened. Another treasury waits.",
            "Next stage"
          );
        } else {
          showBanner(
            "cleared",
            "Stage 01 cleared",
            "You emptied the first Nintendo treasury. The engine already reads a stage list — later raids can be added as more 28×16 maps.",
            "Play Stage 1 again"
          );
        }
      }

      function showBanner(mode, title, copy, label) {
        bannerMode = mode;
        banner.querySelector("h2").textContent = title;
        bannerCopy.textContent = copy;
        bannerBtn.textContent = label;
        banner.classList.add("show");
        state = mode === "next" || mode === "cleared" ? "won" : mode === "gameover" ? "dead" : "title";
      }

      function neighbors(x, y) {
        const out = [];
        const stable =
          isLadder(x, y) ||
          isRope(x, y) ||
          isBlocking(x, y + 1) ||
          trappedGuardAt(x, y + 1);
        if (!stable) {
          if (y + 1 < rows && !bodyBlocked(x, y + 1)) out.push([x, y + 1]);
          return out;
        }
        for (const dx of [-1, 1]) {
          const nx = x + dx;
          if (nx < 0 || nx >= cols) continue;
          if (!bodyBlocked(nx, y)) out.push([nx, y]);
        }
        if (isLadder(x, y)) {
          if (y > 0 && !bodyBlocked(x, y - 1)) out.push([x, y - 1]);
          if (y + 1 < rows && !bodyBlocked(x, y + 1)) out.push([x, y + 1]);
        }
        if (isRope(x, y) && y + 1 < rows && !bodyBlocked(x, y + 1)) out.push([x, y + 1]);
        return out;
      }

      function bfs(sx, sy, tx, ty) {
        if (sx === tx && sy === ty) return [[sx, sy]];
        const key = (x, y) => `${x},${y}`;
        const q = [[sx, sy]];
        const prev = new Map();
        prev.set(key(sx, sy), null);
        let steps = 0;
        while (q.length && steps++ < 500) {
          const [x, y] = q.shift();
          for (const [nx, ny] of neighbors(x, y)) {
            const k = key(nx, ny);
            if (prev.has(k)) continue;
            prev.set(k, [x, y]);
            if (nx === tx && ny === ty) {
              const path = [[nx, ny]];
              let c = [nx, ny];
              while (prev.get(key(c[0], c[1]))) {
                c = prev.get(key(c[0], c[1]));
                path.push(c);
              }
              path.reverse();
              return path;
            }
            q.push([nx, ny]);
          }
        }
        return null;
      }

      function thinkGuard(g) {
        const sx = roundish(g.x);
        const sy = roundish(g.y);
        const tx = roundish(runner.x);
        const ty = roundish(runner.y);
        const path = bfs(sx, sy, tx, ty);
        if (path && path.length > 1) {
          g.wish.x = Math.sign(path[1][0] - sx);
          g.wish.y = Math.sign(path[1][1] - sy);
          return;
        }
        g.wish.x = Math.sign(tx - sx);
        g.wish.y = Math.sign(ty - sy);
      }

      function moveFall(actor, dt) {
        actor.falling = true;
        actor.x += (roundish(actor.x) - actor.x) * Math.min(1, 20 * dt);
        const ny = actor.y + SPEED_FALL * dt;
        const tx = roundish(actor.x);
        const from = actor.y;
        const maxY = Math.floor(ny + 0.51);
        for (let ty = Math.floor(from + 0.51) + 1; ty <= maxY; ty++) {
          if (actor.isGuard && isHole(tx, ty) && ny >= ty - 0.02) {
            actor.y = ty;
            actor.falling = false;
            actor.stuck = true;
            actor.stuckT = HOLE_STUCK;
            dropGold(actor);
            score += 75;
            beep(160, 0.12, "triangle", 0.04);
            updateHud();
            return;
          }
          if (isBlocking(tx, ty) || trappedGuardAt(tx, ty)) {
            actor.y = ty - 1;
            actor.falling = false;
            return;
          }
        }
        actor.y = ny;
        if (actor.y > rows - 0.05) {
          if (actor.isGuard) crushGuard(actor);
          else killRunner();
        }
      }

      function tryStep(actor, dx, dy, speed, dt) {
        const tx0 = roundish(actor.x);
        const ty0 = roundish(actor.y);
        if (dx && dy) {
          if (isLadder(tx0, ty0) && aligned(actor.x)) dx = 0;
          else dy = 0;
        }
        if (dy < 0) {
          if (!aligned(actor.x)) actor.x += (tx0 - actor.x) * Math.min(1, 25 * dt);
          if (!isLadder(tx0, ty0) && !isLadder(tx0, ty0 - 1) && !(exitOpen && actor.y <= 0.2)) {
            dy = 0;
          }
        }
        if (dy > 0) {
          const tx = roundish(actor.x);
          const ty = roundish(actor.y);
          const canDrop =
            isLadder(tx, ty) ||
            isRope(tx, ty) ||
            isHole(tx, ty + 1) ||
            !isBlocking(tx, ty + 1);
          if (!canDrop) dy = 0;
          if (isRope(tx, ty) && !isLadder(tx, ty) && aligned(actor.y)) {
            actor.y += 0.12;
            actor.falling = true;
            return;
          }
        }
        const step = speed * dt;
        if (dx) {
          if (!aligned(actor.y) && !actor.falling) {
            actor.y += (roundish(actor.y) - actor.y) * Math.min(1, 25 * dt);
          }
          const nx = actor.x + dx * step;
          const tx = dx > 0 ? Math.floor(nx + 0.5) : Math.ceil(nx - 0.5);
          const ty = roundish(actor.y);
          if (bodyBlocked(tx, ty) && Math.sign(tx - actor.x) === dx) {
            actor.x = dx > 0 ? tx - 1 : tx + 1;
          } else {
            actor.x = Math.min(cols - 1, Math.max(0, nx));
          }
          actor.facing = dx;
        }
        if (dy) {
          if (!aligned(actor.x)) {
            actor.x += (roundish(actor.x) - actor.x) * Math.min(1, 25 * dt);
          }
          const ny = actor.y + dy * step;
          const ty = dy > 0 ? Math.floor(ny + 0.5) : Math.ceil(ny - 0.5);
          const tx = roundish(actor.x);
          if (bodyBlocked(tx, ty) && Math.sign(ty - actor.y) === dy) {
            actor.y = dy > 0 ? ty - 1 : ty + 1;
          } else {
            actor.y = Math.min(rows - 0.02, Math.max(-0.45, ny));
          }
        }
      }

      function updateRunner(dt) {
        if (!runner.alive) {
          runner.laser.visible = false;
          return;
        }
        if (runner.digging > 0) {
          runner.digging -= dt;
          const from = worldPos(runner.x, runner.y);
          const dest = worldPos(runner.x + runner.digDir, runner.y + 0.85);
          runner.laser.visible = true;
          runner.laser.position.set((from.x + dest.x) / 2, (from.y + dest.y) / 2, 0.35);
          runner.laser.rotation.z = Math.atan2(dest.y - from.y, dest.x - from.x);
          runner.laser.scale.set(1.15, 1, 1);
          if (runner.digging <= 0) {
            const tx = roundish(runner.x) + runner.digDir;
            const ty = roundish(runner.y) + 1;
            if (canDigAt(tx, ty)) openHole(tx, ty);
            runner.digging = 0;
            runner.laser.visible = false;
          }
          return;
        }
        runner.laser.visible = false;
        if (!supported(runner)) {
          moveFall(runner, dt);
        } else {
          runner.falling = false;
          const wish = wishFromInput();
          if (runner.stuck) {
            wish.y = 0;
          }
          if (isHole(roundish(runner.x), roundish(runner.y)) && isBlocking(roundish(runner.x), roundish(runner.y) + 1)) {
            runner.stuck = true;
            wish.y = 0;
          } else {
            runner.stuck = false;
          }
          tryStep(runner, wish.x, wish.y, SPEED_PLAYER, dt);
        }
        tryPickupGold(runner);
        if (!runner.falling) {
          if (aligned(runner.x)) runner.x = roundish(runner.x);
          if (aligned(runner.y)) runner.y = roundish(runner.y);
        }
        if (digQueue) {
          startDig(digQueue);
          digQueue = 0;
        }
        if (exitOpen && runner.y <= -0.15) winStage();
      }

      function updateGuards(dt) {
        for (const g of guards) {
          if (!g.alive) continue;
          g.isGuard = true;
          if (g.stuck) {
            g.stuckT -= dt;
            if (g.stuckT <= 0) {
              const tx = roundish(g.x);
              const ty = roundish(g.y);
              if (!isBlocking(tx, ty - 1)) {
                g.stuck = false;
                g.y = ty - 1;
                g.climbingOut = 0.12;
              } else {
                g.stuckT = 0.2;
              }
            }
            continue;
          }
          if (!supported(g)) {
            moveFall(g, dt);
          } else {
            g.falling = false;
            g.thinkT -= dt;
            if (g.thinkT <= 0) {
              thinkGuard(g);
              g.thinkT = 0.16;
            }
            tryStep(g, g.wish.x, g.wish.y, SPEED_GUARD, dt);
            if (!g.falling) {
              if (aligned(g.x)) g.x = roundish(g.x);
              if (aligned(g.y)) g.y = roundish(g.y);
            }
            if (g.carrying) {
              if (Math.abs(g.wish.x) > 0) {
                g.dropIn -= dt * SPEED_GUARD;
                if (g.dropIn <= 0) dropGold(g);
              }
            } else {
              tryPickupGold(g);
            }
          }
          if (
            runner.alive &&
            Math.abs(g.x - runner.x) < 0.55 &&
            Math.abs(g.y - runner.y) < 0.45 &&
            (!g.stuck || roundish(runner.y) === roundish(g.y))
          ) {
            killRunner();
          }
        }
        if (!exitOpen && golds.every((g) => g.taken)) openExit();
      }

      function updateHoles(dt) {
        for (let i = holes.length - 1; i >= 0; i--) {
          const h = holes[i];
          h.t += dt;
          if (h.t >= HOLE_LIFE) {
            fillHole(h);
            holes.splice(i, 1);
          }
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          p.vy -= 9 * dt;
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          p.mesh.rotation.x += dt * 6;
          if (p.life <= 0) {
            fxGroup.remove(p.mesh);
            particles.splice(i, 1);
          }
        }
      }

      function syncActorMesh(actor, t) {
        const p = worldPos(actor.x, actor.y);
        const sink = actor.stuck ? 0.22 : 0;
        actor.mesh.position.set(p.x, p.y - 0.48 - sink, 0.2);
        actor.mesh.scale.x = actor.facing < 0 ? -1 : 1;
        if (actor.mesh.userData.goldBag) {
          actor.mesh.userData.goldBag.visible = Boolean(actor.carrying);
        }
        let pose = "stand";
        if (actor.stuck) pose = "stuck";
        else if (actor.digging > 0) pose = "dig";
        else if (actor.falling) pose = "fall";
        else {
          const tx = roundish(actor.x);
          const ty = roundish(actor.y);
          if (isRope(tx, ty) && aligned(actor.y) && !isLadder(tx, ty)) pose = "hang";
          else if (isLadder(tx, ty) && Math.abs(actor.y - ty) > 0.05) pose = "climb";
          else if (Math.abs(actor.x - tx) > 0.05) pose = "walk";
        }
        if (actor.mesh.userData.animate) actor.mesh.userData.animate(pose, t, actor.facing);
      }

      function updateCamera() {
        const hud = 52;
        const tilePx = Math.min(innerWidth / 16, (innerHeight - hud) / 13.2);
        const viewW = innerWidth / tilePx;
        const viewH = (innerHeight - hud) / tilePx;
        camera.left = -viewW / 2;
        camera.right = viewW / 2;
        camera.top = viewH / 2;
        camera.bottom = -viewH / 2;
        camera.updateProjectionMatrix();

        const targetX = runner.x + 0.5;
        const targetY = rows - runner.y - 0.35;
        const marginX = Math.max(2.2, viewW / 2 - 2.4);
        const marginY = Math.max(2.2, viewH / 2 - 2.2);
        const minX = Math.min(viewW / 2, cols / 2);
        const maxX = Math.max(cols - viewW / 2, minX);
        const minY = Math.min(viewH / 2, rows / 2);
        const maxY = Math.max(rows - viewH / 2, minY);
        let wantX = camX;
        let wantY = camY;
        if (targetX > camX + marginX) wantX = targetX - marginX;
        if (targetX < camX - marginX) wantX = targetX + marginX;
        if (targetY > camY + marginY) wantY = targetY - marginY;
        if (targetY < camY - marginY) wantY = targetY + marginY;
        camX = THREE.MathUtils.clamp(wantX, minX, maxX);
        camY = THREE.MathUtils.clamp(wantY, minY, maxY);
        const jx = shake ? (Math.random() - 0.5) * shake * 1.2 : 0;
        const jy = shake ? (Math.random() - 0.5) * shake * 1.2 : 0;
        camera.position.set(camX + jx, camY + 1.15 + jy, 16);
        camera.lookAt(camX + jx, camY + jy, 0);
      }

      function animateGold(t) {
        for (const g of golds) {
          if (g.taken || g.carrier) continue;
          if (g.mesh.userData.bob) {
            g.mesh.userData.bob.position.y = Math.sin(t * 3 + g.x) * 0.04;
            g.mesh.userData.bob.rotation.y = Math.sin(t * 0.7 + g.x) * 0.08;
          }
        }
      }

      function tick() {
        const dt = Math.min(0.033, clock.getDelta());
        const t = clock.elapsedTime;
        if (state === "play") {
          updateHoles(dt);
          updateRunner(dt);
          updateGuards(dt);
          updateParticles(dt);
        }
        if (runner) {
          syncActorMesh(runner, t);
          for (const g of guards) if (g.alive) syncActorMesh(g, t);
          animateGold(t);
          updateCamera();
          shake = Math.max(0, shake - dt);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      function bind() {
        addEventListener("keydown", (e) => {
          const k = e.key.toLowerCase();
          if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k) || k.length === 1) {
            e.preventDefault();
          }
          keys.add(k);
          if (!e.repeat && k === " ") {
            if (state !== "play") bannerBtn.click();
            else digQueue = runner?.facing || 1;
          }
          if (k === "r" && (state === "play" || state === "dead" || state === "won")) {
            loadStage(stageIndex, true);
            state = "play";
            banner.classList.remove("show");
          }
          if (k === "enter") bannerBtn.click();
        });
        addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
        addEventListener("resize", () => {
          renderer.setSize(innerWidth, innerHeight);
        });
        bannerBtn.addEventListener("click", () => {
          if (audioCtx) audioCtx.resume();
          else {
            try {
              audioCtx = new AudioContext();
            } catch {
              /* ignore */
            }
          }
          banner.classList.remove("show");
          if (bannerMode === "next") {
            loadStage(stageIndex + 1, true);
          } else if (bannerMode === "cleared") {
            loadStage(0, true);
          } else if (bannerMode === "gameover") {
            loadStage(0, false);
          }
          state = "play";
        });
        document.querySelectorAll(".touch [data-dir]").forEach((btn) => {
          const dir = btn.getAttribute("data-dir");
          const on = () => {
            hold[dir] = true;
          };
          const off = () => {
            hold[dir] = false;
          };
          btn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            on();
          });
          btn.addEventListener("pointerup", off);
          btn.addEventListener("pointerleave", off);
          btn.addEventListener("pointercancel", off);
        });
        document.querySelectorAll(".touch [data-dig]").forEach((btn) => {
          btn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            digQueue = runner?.facing || 1;
          });
        });
      }

      loadStage(0, false);
      bind();
      tick();
    </script>
  </body>
</html>

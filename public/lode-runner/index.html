<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Lode Runner</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --line: #334155;
        --panel: rgba(8, 10, 16, 0.84);
        --gold: #f4d35e;
        --cyan: #7ee0ff;
        --brick: #e25a32;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fcfcfc;
        touch-action: none;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.45rem 1.2rem;
        padding: 0.45rem 0.8rem 0.55rem;
        background: #000;
        border-top: 2px solid #fcfcfc;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: clamp(0.7rem, 2.1vw, 0.95rem);
        letter-spacing: 0.12em;
        pointer-events: none;
      }
      .hud .stat {
        font-variant-numeric: tabular-nums;
      }
      .hud b {
        color: #f8d020;
        font-weight: 700;
      }
      .hint {
        margin: 0;
        color: #a0a0a0;
        letter-spacing: 0.06em;
        font-size: 0.72rem;
      }
      .hint kbd {
        display: inline-block;
        padding: 0 0.22rem;
        border: 1px solid #666;
        color: #fcfcfc;
        font: inherit;
        font-size: 0.68rem;
      }
      a {
        color: var(--cyan);
        pointer-events: auto;
      }
      .banner {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        width: min(26rem, calc(100vw - 2rem));
        padding: 1.15rem 1.2rem 1.2rem;
        border-radius: 16px;
        border: 1px solid #334155;
        background: rgba(8, 10, 16, 0.94);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .banner.show {
        display: block;
      }
      .banner h2 {
        margin: 0 0 0.4rem;
        font-size: 1.2rem;
        letter-spacing: 0.06em;
        color: var(--gold);
      }
      .banner p {
        margin: 0 0 0.9rem;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
      }
      .banner button,
      .touch button {
        appearance: none;
        border: 1px solid #334155;
        background: #111827;
        color: var(--ink);
        border-radius: 8px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .banner button:hover,
      .touch button:hover {
        border-color: var(--cyan);
      }
      .touch {
        position: fixed;
        inset: auto 0 3.1rem 0;
        z-index: 4;
        display: none;
        justify-content: space-between;
        padding: 0 0.7rem;
        pointer-events: none;
      }
      .touch .pad,
      .touch .digs {
        display: grid;
        gap: 0.35rem;
        pointer-events: auto;
      }
      .touch .pad {
        grid-template-columns: 3.1rem 3.1rem 3.1rem;
        grid-template-rows: 3.1rem 3.1rem 3.1rem;
      }
      .touch .pad button:nth-child(1) {
        grid-column: 2;
      }
      .touch .pad button:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
      }
      .touch .pad button:nth-child(3) {
        grid-column: 3;
        grid-row: 2;
      }
      .touch .pad button:nth-child(4) {
        grid-column: 2;
        grid-row: 3;
      }
      .touch .digs {
        align-content: end;
        grid-template-columns: 5.2rem;
      }
      .touch button {
        width: 100%;
        height: 3.1rem;
        background: rgba(17, 24, 39, 0.78);
        font-weight: 700;
        user-select: none;
      }
      .touch .digs button {
        height: 4.2rem;
      }
      @media (pointer: coarse) {
        .touch {
          display: flex;
        }
        .hud .hint {
          display: none;
        }
      }
      .build-badge {
        position: fixed;
        top: 0.35rem;
        right: 0.5rem;
        z-index: 9999;
        font-size: 0.65rem;
        line-height: 1.25;
        color: rgba(148, 163, 184, 0.72);
        text-align: right;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="build-badge" aria-hidden="true">v2 2026-08-17 14:22</div>
    <aside class="hud">
      <span class="stat">SCORE-<b id="score">000000</b></span>
      <span class="stat">MEN-<b id="lives">05</b></span>
      <span class="stat">STAGE-<b id="stage">01</b></span>
      <span class="stat">GOLD-<b id="gold">0/0</b></span>
      <p class="hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
        · <kbd>Space</kbd> dig
        · <kbd>R</kbd> retry
        · <a href="/">All projects</a>
      </p>
    </aside>
    <div class="banner show" id="banner">
      <h2>LODE RUNNER</h2>
      <p id="banner-copy">
        Stage 1. Collect every gold pile, trap the magenta guards, then climb
        the hidden ladder. WASD to move. Space digs a pit in the way you face.
      </p>
      <button type="button" id="banner-btn">PRESS SPACE</button>
    </div>
    <div class="touch" aria-hidden="true">
      <div class="pad">
        <button type="button" data-dir="up">W</button>
        <button type="button" data-dir="left">A</button>
        <button type="button" data-dir="right">D</button>
        <button type="button" data-dir="down">S</button>
      </div>
      <div class="digs">
        <button type="button" data-dig="face">DIG</button>
      </div>
    </div>
    <script type="module">
      import { boot } from "./game.js";
      boot();
    </script>
  </body>
</html>

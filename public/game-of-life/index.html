<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070c;
        color: #e2e8f0;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: 1rem auto auto 1rem;
        z-index: 2;
        width: min(22rem, calc(100vw - 2rem));
        padding: 1rem 1.1rem 1.05rem;
        border: 1px solid #243044;
        border-radius: 14px;
        background: rgba(8, 12, 20, 0.82);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0 0 0.15rem;
        font-size: 1.15rem;
        letter-spacing: 0.02em;
      }
      .lede {
        margin: 0 0 0.9rem;
        color: #94a3b8;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      .stats {
        display: flex;
        gap: 0.7rem;
        margin: 0 0 0.85rem;
        font-variant-numeric: tabular-nums;
        font-size: 0.78rem;
        color: #cbd5e1;
      }
      .stats span {
        color: #7dd3fc;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.7rem;
      }
      button,
      select {
        appearance: none;
        border: 1px solid #334155;
        background: #111827;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 0.38rem 0.65rem;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: #7dd3fc;
      }
      button.active {
        background: #164e63;
        border-color: #22d3ee;
      }
      label.control {
        display: grid;
        grid-template-columns: 4.2rem 1fr 3.2rem;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 0.65rem;
        font-size: 0.8rem;
        color: #cbd5e1;
      }
      label.seed {
        grid-template-columns: 4.2rem 1fr;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #22d3ee;
      }
      select {
        width: 100%;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0.15rem 0 0.75rem;
        font-size: 0.8rem;
        color: #cbd5e1;
      }
      .toggle input {
        width: 1rem;
        height: 1rem;
        accent-color: #f59e0b;
      }
      .hint {
        margin: 0;
        color: #64748b;
        font-size: 0.75rem;
        line-height: 1.4;
      }
      a {
        color: #7dd3fc;
      }
      .build-badge {
        position: fixed;
        top: 0.35rem;
        right: 0.5rem;
        z-index: 9999;
        font-size: 0.65rem;
        line-height: 1.25;
        color: rgba(148, 163, 184, 0.72);
        text-align: right;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="build-badge" aria-hidden="true">v2 2026-08-17 14:22</div>
    <div class="hud">
      <h1>Game of Life</h1>
      <p class="lede">
        Conway’s cellular automaton on a wrapping lattice. Reverse replays the
        recorded history.
      </p>
      <div class="stats">
        <div>Gen <span id="gen">0</span></div>
        <div>Alive <span id="alive">0</span></div>
        <div>History <span id="hist">0</span></div>
      </div>
      <div class="row">
        <button id="play" class="active" type="button">Pause</button>
        <button id="step" type="button">Step</button>
        <button id="random" type="button">Randomize</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <label class="control seed">
        Seed
        <select id="seed">
          <option value="pulsar">Pulsar</option>
          <option value="glider">Glider</option>
          <option value="lwss">Lightweight spaceship</option>
          <option value="pentadecathlon">Pentadecathlon</option>
          <option value="rpentomino">R-pentomino</option>
          <option value="acorn">Acorn</option>
          <option value="gun">Gosper glider gun</option>
          <option value="random">Random cluster</option>
        </select>
      </label>
      <label class="control">
        Speed
        <input id="speed" type="range" min="0" max="100" value="59" />
        <span id="speed-val">1/s</span>
      </label>
      <label class="toggle">
        <input id="reverse" type="checkbox" />
        Reverse (replay history)
      </label>
      <label class="toggle">
        <input id="mode2d" type="checkbox" />
        Strict 2D
      </label>
      <p class="hint">
        <span id="hint-cam">Drag to orbit. Click or paint cells. Space pauses.</span>
        <a href="/">All projects</a>
      </p>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const COLS = 48;
      const ROWS = 48;
      const CELL = 1.35;
      const MAX_HISTORY = 2400;
      const SIZE = COLS * ROWS;
      const BOARD_W = COLS * CELL;
      const BOARD_H = ROWS * CELL;

      const PATTERNS = {
        glider: [
          [1, 0],
          [2, 1],
          [0, 2],
          [1, 2],
          [2, 2],
        ],
        lwss: [
          [1, 0],
          [4, 0],
          [0, 1],
          [0, 2],
          [4, 2],
          [0, 3],
          [1, 3],
          [2, 3],
          [3, 3],
        ],
        pulsar: (() => {
          const cells = [];
          const bars = [
            [2, 0],
            [3, 0],
            [4, 0],
            [8, 0],
            [9, 0],
            [10, 0],
            [2, 5],
            [3, 5],
            [4, 5],
            [8, 5],
            [9, 5],
            [10, 5],
          ];
          const spokes = [
            [0, 2],
            [0, 3],
            [0, 4],
            [5, 2],
            [5, 3],
            [5, 4],
            [7, 2],
            [7, 3],
            [7, 4],
            [12, 2],
            [12, 3],
            [12, 4],
          ];
          for (const [x, y] of [...bars, ...spokes]) {
            cells.push([x, y], [x, 12 - y]);
          }
          return cells;
        })(),
        pentadecathlon: [
          [2, 0],
          [7, 0],
          [0, 1],
          [1, 1],
          [3, 1],
          [4, 1],
          [5, 1],
          [6, 1],
          [8, 1],
          [9, 1],
          [2, 2],
          [7, 2],
        ],
        rpentomino: [
          [1, 0],
          [2, 0],
          [0, 1],
          [1, 1],
          [1, 2],
        ],
        acorn: [
          [1, 0],
          [3, 1],
          [0, 2],
          [1, 2],
          [4, 2],
          [5, 2],
          [6, 2],
        ],
        gun: [
          [24, 0],
          [22, 1],
          [24, 1],
          [12, 2],
          [13, 2],
          [20, 2],
          [21, 2],
          [34, 2],
          [35, 2],
          [11, 3],
          [15, 3],
          [20, 3],
          [21, 3],
          [34, 3],
          [35, 3],
          [0, 4],
          [1, 4],
          [10, 4],
          [16, 4],
          [20, 4],
          [21, 4],
          [0, 5],
          [1, 5],
          [10, 5],
          [14, 5],
          [16, 5],
          [17, 5],
          [22, 5],
          [24, 5],
          [10, 6],
          [16, 6],
          [24, 6],
          [11, 7],
          [15, 7],
          [12, 8],
          [13, 8],
        ],
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070c);

      const perspCam = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        800
      );
      perspCam.position.set(BOARD_W * 0.62, 22, BOARD_H * 0.72);

      const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
      orthoCam.position.set(BOARD_W / 2, 50, BOARD_H / 2);
      orthoCam.up.set(0, 0, -1);
      orthoCam.lookAt(BOARD_W / 2, 0, BOARD_H / 2);

      let camera = perspCam;
      let mode2D = false;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(BOARD_W / 2, 0, BOARD_H / 2);
      controls.maxPolarAngle = Math.PI * 0.48;
      controls.minDistance = 8;
      controls.maxDistance = 220;
      controls.minZoom = 0.28;
      controls.maxZoom = 10;

      scene.add(new THREE.AmbientLight(0x6b7c99, 0.55));
      const hemi = new THREE.HemisphereLight(0x9bd4ff, 0x1a1020, 0.55);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xe0f2fe, 1.15);
      key.position.set(28, 42, 14);
      scene.add(key);
      const rim = new THREE.PointLight(0x22d3ee, 16, 70, 2);
      rim.position.set(BOARD_W * 0.3, 12, BOARD_H * 0.3);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(BOARD_W + 4, BOARD_H + 4),
        new THREE.MeshStandardMaterial({
          color: 0x0b1220,
          metalness: 0.15,
          roughness: 0.9,
          fog: false,
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(BOARD_W / 2, -0.08, BOARD_H / 2);
      scene.add(floor);

      const gridHelper = new THREE.GridHelper(
        Math.max(COLS, ROWS) * CELL,
        Math.max(COLS, ROWS),
        0x1e293b,
        0x132033
      );
      gridHelper.position.set(BOARD_W / 2, 0.01, BOARD_H / 2);
      for (const mat of [gridHelper.material].flat()) mat.fog = false;
      scene.add(gridHelper);

      const geometry = new THREE.BoxGeometry(1.12, 1, 1.12);
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.18,
        roughness: 0.38,
        emissive: 0x000000,
        emissiveIntensity: 1,
        fog: false,
      });
      const mesh = new THREE.InstancedMesh(geometry, material, SIZE);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.instanceColor = new THREE.InstancedBufferAttribute(
        new Float32Array(SIZE * 3),
        3
      );
      scene.add(mesh);

      const dummy = new THREE.Object3D();
      const color = new THREE.Color();
      const targetColor = new THREE.Color();
      const bornColor = new THREE.Color(0x9af0ff);
      const dieColor = new THREE.Color(0xff8b5c);
      const deadColor = new THREE.Color(0x0c121c);

      let grid = new Uint8Array(SIZE);
      let next = new Uint8Array(SIZE);
      const visLife = new Float32Array(SIZE);
      const visN = new Float32Array(SIZE);
      const visR = new Float32Array(SIZE);
      const visG = new Float32Array(SIZE);
      const visB = new Float32Array(SIZE);
      const history = [];
      let generation = 0;
      let running = true;
      let reverse = false;
      let gensPerSec = 1;
      let accum = 0;
      let painting = false;
      let paintValue = 1;

      const SPEED_MIN = 0.1;
      const SPEED_MAX = 5;

      const genEl = document.getElementById("gen");
      const aliveEl = document.getElementById("alive");
      const histEl = document.getElementById("hist");
      const playBtn = document.getElementById("play");
      const speedInput = document.getElementById("speed");
      const speedVal = document.getElementById("speed-val");
      const reverseInput = document.getElementById("reverse");
      const mode2dInput = document.getElementById("mode2d");
      const seedSelect = document.getElementById("seed");
      const hintCam = document.getElementById("hint-cam");

      function sliderToSpeed(raw) {
        const t = Number(raw) / 100;
        return SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, t);
      }

      function formatSpeed(v) {
        const digits = v < 1 ? 2 : 1;
        return `${Number(v.toFixed(digits))}/s`;
      }

      function applySpeedFromSlider() {
        gensPerSec = sliderToSpeed(speedInput.value);
        speedVal.textContent = formatSpeed(gensPerSec);
      }

      function resizeCameras() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const aspect = w / h;
        perspCam.aspect = aspect;
        perspCam.updateProjectionMatrix();
        const half = 22;
        orthoCam.left = -half * aspect;
        orthoCam.right = half * aspect;
        orthoCam.top = half;
        orthoCam.bottom = -half;
        orthoCam.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function applyViewMode() {
        if (mode2D) {
          camera = orthoCam;
          controls.object = orthoCam;
          controls.enableRotate = false;
          controls.screenSpacePanning = true;
          key.position.set(BOARD_W / 2, 80, BOARD_H / 2);
          hintCam.textContent =
            "Drag to pan. Scroll to zoom. Click or paint cells. Space pauses.";
        } else {
          camera = perspCam;
          controls.object = perspCam;
          controls.enableRotate = true;
          controls.screenSpacePanning = false;
          key.position.set(28, 42, 14);
          hintCam.textContent =
            "Drag to orbit. Click or paint cells. Space pauses.";
        }
        frameLiveCells();
        controls.update();
      }

      function idx(x, y) {
        return ((y + ROWS) % ROWS) * COLS + ((x + COLS) % COLS);
      }

      function neighbors(x, y) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            n += grid[idx(x + dx, y + dy)];
          }
        }
        return n;
      }

      function snapshot() {
        history.push(grid.slice());
        if (history.length > MAX_HISTORY) history.shift();
      }

      function stepForward() {
        snapshot();
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const i = y * COLS + x;
            const n = neighbors(x, y);
            const alive = grid[i] === 1;
            next[i] = alive ? (n === 2 || n === 3 ? 1 : 0) : n === 3 ? 1 : 0;
          }
        }
        const tmp = grid;
        grid = next;
        next = tmp;
        generation += 1;
      }

      function stepBack() {
        if (history.length === 0) return false;
        grid.set(history.pop());
        generation = Math.max(0, generation - 1);
        return true;
      }

      function boundsOf(cells) {
        let maxX = 0;
        let maxY = 0;
        for (const [x, y] of cells) {
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
        return { maxX, maxY };
      }

      function stampCentered(cells) {
        const { maxX, maxY } = boundsOf(cells);
        const ox = Math.floor((COLS - maxX - 1) / 2);
        const oy = Math.floor((ROWS - maxY - 1) / 2);
        for (const [x, y] of cells) grid[idx(ox + x, oy + y)] = 1;
      }

      function randomCluster() {
        const w = 10;
        const h = 10;
        const ox = Math.floor((COLS - w) / 2);
        const oy = Math.floor((ROWS - h) / 2);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (Math.random() < 0.46) grid[idx(ox + x, oy + y)] = 1;
          }
        }
      }

      function resetRun() {
        history.length = 0;
        generation = 0;
        grid.fill(0);
      }

      function plant(name) {
        resetRun();
        if (name === "random") randomCluster();
        else stampCentered(PATTERNS[name]);
        frameLiveCells();
        updateInstances(0, true);
      }

      function frameLiveCells() {
        let minX = COLS;
        let minY = ROWS;
        let maxX = -1;
        let maxY = -1;
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (!grid[y * COLS + x]) continue;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
        const empty = maxX < 0;
        const cx = empty ? BOARD_W / 2 : ((minX + maxX + 1) / 2) * CELL;
        const cz = empty ? BOARD_H / 2 : ((minY + maxY + 1) / 2) * CELL;
        if (mode2D) {
          const span = empty
            ? Math.max(BOARD_W, BOARD_H)
            : Math.max(maxX - minX + 1, maxY - minY + 1, 8) * CELL;
          orthoCam.position.set(cx, 50, cz);
          orthoCam.up.set(0, 0, -1);
          orthoCam.lookAt(cx, 0, cz);
          controls.target.set(cx, 0, cz);
          orthoCam.zoom = THREE.MathUtils.clamp(28 / span, 0.28, 10);
          orthoCam.updateProjectionMatrix();
          return;
        }
        if (empty) {
          controls.target.set(BOARD_W / 2, 0, BOARD_H / 2);
          perspCam.position.set(BOARD_W * 0.62, 22, BOARD_H * 0.72);
          return;
        }
        const span = Math.max(maxX - minX + 1, maxY - minY + 1, 6) * CELL;
        const dist = Math.min(48, Math.max(12, span * 1.4));
        controls.target.set(cx, 0.4, cz);
        perspCam.position.set(cx + dist * 0.42, dist * 0.92, cz + dist * 0.58);
      }

      function ease(t) {
        return t * t * (3 - 2 * t);
      }

      function aliveColor(n, out) {
        const u = n / 8;
        out.setHSL(0.52 - u * 0.42, 0.85, 0.42 + u * 0.18);
      }

      function updateInstances(dt, snap) {
        const rate = Math.max(2.6, gensPerSec * 1.55);
        const k = snap ? 1 : 1 - Math.exp(-Math.min(dt, 0.05) * rate);
        const colorK = snap ? 1 : 1 - Math.exp(-Math.min(dt, 0.05) * rate * 1.2);
        let alive = 0;
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const i = y * COLS + x;
            const isAlive = grid[i] === 1;
            const n = neighbors(x, y);
            visLife[i] += ((isAlive ? 1 : 0) - visLife[i]) * k;
            visN[i] += ((isAlive ? n : visN[i] * 0.25) - visN[i]) * k;
            if (isAlive) {
              alive += 1;
              aliveColor(n, targetColor);
              targetColor.lerp(bornColor, Math.max(0, 1 - visLife[i]) * 0.75);
            } else {
              targetColor.copy(deadColor);
              targetColor.lerp(dieColor, visLife[i] * 0.82);
            }
            visR[i] += (targetColor.r - visR[i]) * colorK;
            visG[i] += (targetColor.g - visG[i]) * colorK;
            visB[i] += (targetColor.b - visB[i]) * colorK;
            const u = ease(Math.min(1, Math.max(0, visLife[i])));
            const h = mode2D ? 0.1 : 0.05 + u * (0.42 + visN[i] * 0.32);
            const s = 0.001 + u * 0.999;
            dummy.position.set(x * CELL + CELL / 2, h / 2, y * CELL + CELL / 2);
            dummy.scale.set(s, mode2D ? 0.1 : Math.max(h, 0.02), s);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
            color.setRGB(visR[i], visG[i], visB[i]);
            mesh.setColorAt(i, color);
          }
        }
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        genEl.textContent = String(generation);
        aliveEl.textContent = String(alive);
        histEl.textContent = String(history.length);
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      function cellFromEvent(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(plane, hit)) return null;
        const x = Math.floor(hit.x / CELL);
        const y = Math.floor(hit.z / CELL);
        if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return null;
        return { x, y };
      }

      function paintAt(event) {
        const cell = cellFromEvent(event);
        if (!cell) return;
        grid[idx(cell.x, cell.y)] = paintValue;
        updateInstances(0, true);
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const cell = cellFromEvent(event);
        if (!cell) return;
        painting = true;
        controls.enabled = false;
        const i = idx(cell.x, cell.y);
        paintValue = grid[i] ? 0 : 1;
        grid[i] = paintValue;
        updateInstances(0, true);
      });
      window.addEventListener("pointermove", (event) => {
        if (!painting) return;
        paintAt(event);
      });
      window.addEventListener("pointerup", () => {
        painting = false;
        controls.enabled = true;
      });

      playBtn.addEventListener("click", () => {
        running = !running;
        playBtn.textContent = running ? "Pause" : "Play";
        playBtn.classList.toggle("active", running);
      });
      document.getElementById("step").addEventListener("click", () => {
        if (reverse) stepBack();
        else stepForward();
        updateInstances(0, false);
      });
      document.getElementById("random").addEventListener("click", () => {
        seedSelect.value = "random";
        plant("random");
      });
      document.getElementById("clear").addEventListener("click", () => {
        resetRun();
        frameLiveCells();
        updateInstances(0, true);
      });
      seedSelect.addEventListener("change", () => {
        plant(seedSelect.value);
      });
      speedInput.addEventListener("input", applySpeedFromSlider);
      reverseInput.addEventListener("change", () => {
        reverse = reverseInput.checked;
      });
      mode2dInput.addEventListener("change", () => {
        mode2D = mode2dInput.checked;
        applyViewMode();
      });
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          playBtn.click();
        }
      });

      window.addEventListener("resize", resizeCameras);

      const clock = new THREE.Clock();
      applySpeedFromSlider();
      resizeCameras();
      plant(seedSelect.value);

      function tick() {
        const dt = clock.getDelta();
        if (running) {
          accum += dt * gensPerSec;
          const steps = Math.min(4, Math.floor(accum));
          accum -= steps;
          for (let i = 0; i < steps; i++) {
            if (reverse) {
              if (!stepBack()) break;
            } else {
              stepForward();
            }
          }
        }
        updateInstances(dt, false);
        rim.position.x = BOARD_W * (0.5 + 0.22 * Math.sin(performance.now() * 0.0004));
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
